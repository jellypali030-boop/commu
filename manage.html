<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            관리진 · COMMU
        </title>
        <style>
            :root {
    --bg:#f7f5fb;
    --ink:#29243b;
    --muted:#827d91;
    --line:#ece8f2;
    --p:#7862cf;
    --soft:#f0ecfb
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:15px system-ui,'Malgun Gothic',sans-serif;
    line-height:1.65
}
button,input,textarea {
    font:inherit
}
a {
    color:inherit
}
header {
    background:linear-gradient(115deg,#7560c9,#b18bda 60%,#e8a8c8);
    color:white;
    padding:22px 18px
}
.top {
    max-width:1000px;
    margin:auto
}
.brand {
    font-size:26px;
    font-weight:850;
    letter-spacing:2px;
    text-decoration:none
}
.tag {
    font-size:13px;
    margin:2px 0 0
}
.nav {
    display:flex;
    gap:6px;
    overflow:auto;
    margin-top:16px
}
.nav a {
    display:block;
    text-decoration:none;
    color:white;
    padding:9px 13px;
    border-radius:10px;
    white-space:nowrap
}
.nav a.active,.nav a:hover {
    background:#fff;
    color:var(--p)
}
main {
    max-width:1000px;
    margin:28px auto;
    padding:0 16px 55px
}
.eyebrow {
    font-size:12px;
    color:var(--p);
    font-weight:800;
    letter-spacing:1.4px
}
.page-head {
    margin-bottom:18px
}
.page-head h1 {
    font-size:clamp(27px,4vw,36px);
    line-height:1.25;
    margin:6px 0
}
.muted {
    font-size:13px;
    color:var(--muted)
}
.card {
    background:white;
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 10px 30px #39245b0b
}
.grid {
    display:grid;
    grid-template-columns:1.5fr .8fr;
    gap:16px
}
.row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
}
.btn {
    display:inline-block;
    border:0;
    border-radius:10px;
    padding:10px 15px;
    background:var(--p);
    color:white;
    text-decoration:none;
    font-weight:700;
    cursor:pointer
}
.btn.alt {
    background:var(--soft);
    color:var(--p)
}
.field {
    width:100%;
    padding:12px;
    border:1px solid var(--line);
    border-radius:10px;
    margin:7px 0 12px;
    outline-color:#a998ed
}
textarea.field {
    min-height:110px;
    resize:vertical
}
.notice {
    padding:12px;
    background:#fff8e9;
    border:1px solid #f3e5c6;
    color:#85652a;
    border-radius:10px;
    font-size:13px;
    margin:12px 0
}
.post {
    padding:16px 0;
    border-bottom:1px solid var(--line)
}
.post p {
    white-space:pre-wrap;
    overflow-wrap:anywhere
}
.meta {
    font-size:12px;
    color:var(--muted)
}
.empty {
    text-align:center;
    padding:25px;
    color:var(--muted)
}
.chatbox {
    height:360px;
    overflow:auto;
    background:#faf9fc;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    margin:12px 0
}
.bubble {
    padding:9px 12px;
    margin:8px 0;
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    overflow-wrap:anywhere
}
.bubble.mine {
    margin-left:auto;
    background:var(--soft);
    max-width:85%
}
.bubble small {
    display:block;
    color:var(--muted);
    font-size:11px
}
.pill {
    font-size:11px;
    color:var(--p);
    background:var(--soft);
    padding:3px 8px;
    border-radius:20px
}
.role-icon {
    display:inline-flex;
    align-items:center;
    vertical-align:-3px;
    margin-left:4px
}
.role-icon img {
    width:26px;
    height:26px;
    object-fit:contain
}
.footer {
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:20px
}
@media(max-width:700px) {
    .grid {
        grid-template-columns:1fr
    }
    .card {
        padding:17px
    }
    .nav {
        gap:2px
    }
    .nav a {
        padding:8px 10px;
        font-size:13px
    }
}
        </style>
    </head>
    <body>
        <header>
            <div class="top">
                <a class="brand" href="index.html"> COMMU</a>
                <p class="tag">
                    관심사를 나누고, 함께 만드는 우리들의 공간
                </p>
                <nav class="nav">
                    <a href="index.html"> 홈</a><a href="board.html" > 게시판</a><a href="chat.html" > 채팅</a><a href="mypage.html" > 마이페이지</a><a href="manage.html" class="active"> 관리진</a>
                </nav>
            </div>
        </header>
        <main>
            <div class="page-head">
                <div class="eyebrow">
                    STAFF AREA · DEMO
                </div>
                <h1>
                    관리진
                </h1>
                <p class="muted">
                    COMMU 안의 독립된 관리진 페이지입니다.
                </p>
            </div>
            <div class="notice">
                이 화면은 디자인 확인용 시제품입니다. 실제 권한 검증이나 가입 승인 기능은 아직 연결되어 있지 않습니다.
            </div>
            <section class="card">
                <h2>
                    가입 신청 관리
                </h2>
                <p class="muted">
                    실제 가입 신청 및 승인 기능은 서버가 필요합니다.
                </p>
                <div class="empty">
                    현재 처리할 가입 신청이 없습니다.
                </div>
            </section>
            <section class="card">
                <h2>
                    권한 표시 예시
                </h2>
                <p>
                    최고 관리자<span class="role-icon"><img src="image/IMG_4701.png" alt="금색 나비 최고 관리자 아이콘"></span>
                </p>
                <p>
                    일반 관리진<span class="role-icon"><img src="image/IMG_4702.png" alt="은색 나방 일반 관리진 아이콘"></span>
                </p>
                <p>
                    일반 회원<span class="muted"> 관리진 아이콘 없음</span>
                </p>
            </section>
            <div class="footer">
                <a class="btn alt" href="index.html"> ← 홈으로 돌아가기</a>
                <p>
                    COMMU · 함께 만드는 커뮤니티
                </p>
            </div>
        </main>
        <script>
            // 관리진 권한과 가입 승인 기능은 백엔드 연결 후 구현할 수 있습니다.
        </script>
    </body>
</html>
