const expandedComments=new Set(),allCommentsByPost={};
const myLikedPosts=new Set(),checkedLikePosts=new Set();
async function loadMyLikes(posts){const fresh=posts.filter(p=>!checkedLikePosts.has(p.id));fresh.forEach(p=>checkedLikePosts.add(p.id));await Promise.all(fresh.map(async p=>{try{const snap=await getDoc(doc(db,"posts",p.id,"likes",me.uid));if(snap.exists())myLikedPosts.add(p.id);}catch(err){console.error("좋아요 상태 확인 실패",err);}}));renderPosts();}
function renderPosts(){
 const term=$("#searchInput").value.trim().toLocaleLowerCase("ko");
 const filtered=allPosts.filter(p=>!term||String(p.title||"").toLocaleLowerCase("ko").includes(term)||String(p.body||"").toLocaleLowerCase("ko").includes(term)).sort((a,b)=>Number(!!b.isNotice)-Number(!!a.isNotice));
 $("#postCount").textContent=allPosts.length+"개";
 $("#searchCount").textContent=term?filtered.length+"개 검색":"";
 $("#posts").innerHTML=filtered.length?filtered.map(p=>{
  const comments=expandedComments.has(p.id)?(allCommentsByPost[p.id]||[]):(latestCommentsByPost[p.id]||[]);
  return '<article class="post" data-open="'+safe(p.id)+'" tabindex="0" aria-label="게시글 열기: '+safe(p.title||"제목 없음")+'"><div class="post-content"><div class="post-text"><div class="post-title" data-open="'+safe(p.id)+'">'+(p.isNotice?'<span class="tag-notice">공지</span> ':"")+safe(p.title||"제목 없음")+'</div><div class="post-meta"><span>'+safe(p.nickname||"익명")+'</span><span>·</span><span>'+dateText(p.createdAt)+'</span></div><div class="post-preview">'+safe(p.body||"")+'</div></div>'+(p.imageData?'<img class="post-thumb" data-open="'+safe(p.id)+'" src="'+safe(p.imageData)+'" alt="게시글 첨부 사진">':"")+'</div><div class="post-stats"><button class="post-like-button '+(myLikedPosts.has(p.id)?'liked':'')+'" type="button" data-post-like="'+safe(p.id)+'" aria-pressed="'+(myLikedPosts.has(p.id)?'true':'false')+'">'+(myLikedPosts.has(p.id)?'♥':'♡')+' 좋아요 '+Number(p.likesCount||0)+'</button><button class="post-stat" type="button" data-comments="'+safe(p.id)+'">'+(expandedComments.has(p.id)?'댓글 접기':'댓글 '+Number(p.commentsCount||0)+' 보기')+'</button><button class="inline-reply-toggle" type="button" data-inline-toggle="'+safe(p.id)+'">댓글 달기</button></div><div class="latest-comments">'+(comments.length?comments.map(cm=>'<div class="latest-comment"><strong>'+safe(cm.nickname||"익명")+'</strong>'+safe(cm.text)+'</div>').join(""):(Number(p.commentsCount||0)>0?'<div class="no-comments">댓글을 불러오는 중이에요.</div>':'<div class="no-comments">아직 댓글이 없어요.</div>'))+'</div><form class="inline-reply-form hidden" data-inline-form="'+safe(p.id)+'"><textarea maxlength="1000" placeholder="이 게시글에 댓글을 남겨보세요" required aria-label="댓글 내용"></textarea><button class="btn" type="submit">등록</button></form></article>';
 }).join(""):'<div class="empty">'+(term?"검색 결과가 없어요.":"아직 게시글이 없어요. 첫 이야기를 남겨보세요.")+'</div>';
}
async function loadLatestComments(posts){
 const version=++commentsLoadVersion;
 const targets=posts.filter(p=>Number(p.commentsCount||0)>0);
 const results=await Promise.all(targets.map(async p=>{
  const snap=await getDocs(query(collection(db,"comments"),where("postId","==",p.id)));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  return [p.id,rows.slice(0,2).reverse()];
 }).map(p=>p.catch(()=>null)));
 if(version!==commentsLoadVersion)return;
 latestCommentsByPost={};
 results.filter(Boolean).forEach(([id,rows])=>latestCommentsByPost[id]=rows);
 renderPosts();
}
let searchOpen=false;
$("#searchToggle").addEventListener("click",()=>{const input=$("#searchInput"),form=$("#searchForm");searchOpen=!searchOpen;if(searchOpen){form.classList.remove("hidden");$("#searchToggle").setAttribute("aria-label","검색 취소");$("#searchToggle").setAttribute("aria-expanded","true");input.focus();}else{input.value="";input.blur();form.classList.add("hidden");$("#searchToggle").setAttribute("aria-label","검색창 열기");$("#searchToggle").setAttribute("aria-expanded","false");renderPosts();}});
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();renderPosts();});
$("#postForm").addEventListener("submit",async e=>{e.preventDefault();const title=$("#postTitle").value.trim(),body=$("#postBody").value.trim();if(!title||!body)return;const btn=$("#submitPost");btn.disabled=true;try{const original=editingId?allPosts.find(p=>p.id===editingId):null;const data={title,body,nickname:original?.nickname||(profile.nickname||"새로운 회원"),ownerUid:original?.ownerUid||me.uid};if(editingId)data.updatedAt=serverTimestamp();if(selectedImage)data.imageData=selectedImage;else if(editingId)data.imageData="";if(isAdmin())data.isNotice=$("#noticeToggle").checked;
 if(editingId){const old=allPosts.find(p=>p.id===editingId);if(!old||old.ownerUid!==me.uid)throw Error("본인이 작성한 글만 수정할 수 있어요.");if(!isAdmin())delete data.isNotice;data.editedAt=serverTimestamp();await updateDoc(doc(db,"posts",editingId),data);status("게시글을 수정했어요.");}else{data.createdAt=serverTimestamp();data.likesCount=0;data.commentsCount=0;data.isNotice=false;await addDoc(collection(db,"posts"),data);status("게시글을 등록했어요.");}
 resetEditor();}catch(err){console.error(err);status(err.message||"게시글 저장에 실패했어요. Firestore 권한을 확인해 주세요.",true);}finally{btn.disabled=false;}});
$("#posts").addEventListener("click",async e=>{const likeButton=e.target.closest("[data-post-like]");if(likeButton){e.preventDefault();e.stopPropagation();const postId=likeButton.dataset.postLike,postRef=doc(db,"posts",postId),likeRef=doc(db,"posts",postId,"likes",me.uid);likeButton.disabled=true;try{let nowLiked=false;await runTransaction(db,async tx=>{const [likeSnap,postSnap]=await Promise.all([tx.get(likeRef),tx.get(postRef)]);if(!postSnap.exists())throw Error("게시글이 삭제되었어요.");if(likeSnap.exists()){tx.delete(likeRef);tx.update(postRef,{likesCount:increment(-1)});nowLiked=false;}else{tx.set(likeRef,{uid:me.uid,createdAt:serverTimestamp()});tx.update(postRef,{likesCount:increment(1)});nowLiked=true;}});if(nowLiked)myLikedPosts.add(postId);else myLikedPosts.delete(postId);const post=allPosts.find(p=>p.id===postId);if(post)post.likesCount=Math.max(0,Number(post.likesCount||0)+(nowLiked?1:-1));renderPosts();}catch(err){console.error(err);alert("좋아요 처리에 실패했어요. "+(err.code||err.message||"권한을 확인해 주세요."));likeButton.disabled=false;}return;}const inlineToggle=e.target.closest("[data-inline-toggle]");if(inlineToggle){const id=inlineToggle.dataset.inlineToggle;const form=[...$("#posts").querySelectorAll("[data-inline-form]")].find(x=>x.dataset.inlineForm===id);if(form){form.classList.toggle("hidden");if(!form.classList.contains("hidden"))form.querySelector("textarea").focus();}return;}const commentButton=e.target.closest("[data-comments]");if(commentButton){openPost(commentButton.dataset.comments,true);return;}const postCard=e.target.closest(".post[data-open]");if(postCard&&!e.target.closest("form,textarea,input,button"))openPost(postCard.dataset.open);});
$("#posts").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const postCard=e.target.closest(".post[data-open]");if(!postCard||e.target.closest("button,a,input,textarea"))return;e.preventDefault();openPost(postCard.dataset.open);});
$("#posts").addEventListener("submit",async e=>{const form=e.target.closest("[data-inline-form]");if(!form)return;e.preventDefault();const postId=form.dataset.inlineForm,textarea=form.querySelector("textarea"),text=textarea.value.trim(),button=form.querySelector("button[type=submit]");if(!text)return;button.disabled=true;try{await addDoc(collection(db,"comments"),{postId,ownerUid:me.uid,nickname:profile.nickname||"새로운 회원",text,createdAt:serverTimestamp()});await updateDoc(doc(db,"posts",postId),{commentsCount:increment(1)});textarea.value="";form.classList.add("hidden");await loadLatestComments(allPosts);}catch(err){console.error(err);alert("댓글 등록에 실패했어요. "+(err.code||"권한을 확인해 주세요."));}finally{button.disabled=false;}});
async function openPost(id,focusComments=false){const p=allPosts.find(x=>x.id===id);if(!p)return;if(!document.body.classList.contains("detail-mode")){history.pushState({commuBoardDetail:true},"","#post-"+encodeURIComponent(id));detailHistoryActive=true;}activePost=p;document.body.classList.add("detail-mode");$("#detailCard").classList.remove("hidden");$("#detailCard").scrollTop=0;const canEdit=p.ownerUid===me.uid,canDelete=canEdit||isAdmin();
 $("#detailContent").innerHTML=(p.isNotice?'<span class="tag-notice">공지사항</span>':"")+'<div class="detail-title-row"><h2>'+safe(p.title)+'</h2>'+((canEdit||canDelete)?'<div class="post-menu"><button class="post-menu-trigger" id="postMenuTrigger" type="button" aria-label="게시글 메뉴" aria-expanded="false">···</button><div class="post-menu-list hidden" id="postMenuList">'+(canEdit?'<button id="editPost" type="button">수정</button>':"")+(canDelete?'<button id="deletePost" type="button">삭제</button>':"")+'</div></div>':"")+'</div><div class="post-meta"><span>'+safe(p.nickname||"익명")+'</span><span>·</span><span>'+dateText(p.createdAt)+'</span>'+(p.updatedAt?'<span>· 수정됨</span>':"")+'</div><div class="detail-body">'+safe(p.body)+'</div>'+(p.imageData?'<img class="detail-image" src="'+p.imageData+'" alt="게시글 첨부 사진">':"");
 $("#detailOwnerActions").textContent=p.nickname||"";
 $("#detailLike").textContent="♡ 좋아요 "+Number(p.likesCount||0);$("#detailLike").classList.remove("liked");
 const likeRef=doc(db,"posts",id,"likes",me.uid);const likeSnap=await getDoc(likeRef);liked=likeSnap.exists();$("#detailLike").textContent=(liked?"♥":"♡")+" 좋아요 "+Number(p.likesCount||0);$("#detailLike").classList.toggle("liked",liked);
 let jumpedToFirstComment=false;if(commentsUnsub)commentsUnsub();commentsUnsub=onSnapshot(query(collection(db,"comments"),where("postId","==",id)),snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));$("#commentCount").textContent=rows.length+"개";$("#comments").innerHTML=rows.length?rows.map(c=>'<div class="comment"><div class="row"><strong>'+safe(c.nickname||"익명")+'</strong><span class="meta">'+dateText(c.createdAt)+'</span></div><p>'+safe(c.text)+'</p>'+(c.ownerUid===me.uid?'<button class="comment-delete" data-delete-comment="'+safe(c.id)+'" type="button" aria-label="댓글 삭제" title="댓글 삭제">×</button>':"")+'</div>').join(""):'<div class="empty">첫 댓글을 남겨보세요.</div>';if(focusComments&&!jumpedToFirstComment&&rows.length){jumpedToFirstComment=true;requestAnimationFrame(()=>{const target=$("#comments").querySelector(".comment");const panel=$("#detailCard");if(target&&panel){const top=target.getBoundingClientRect().top-panel.getBoundingClientRect().top+panel.scrollTop;panel.scrollTop=top-82;}});}},err=>{$("#comments").textContent="댓글을 불러오지 못했어요: "+(err.code||"오류");});
}
function closeDetail(){ $("#detailCard").classList.add("hidden");document.body.classList.remove("detail-mode");activePost=null;detailHistoryActive=false;if(commentsUnsub){commentsUnsub();commentsUnsub=null;} }
window.addEventListener("popstate",()=>{if(document.body.classList.contains("detail-mode"))closeDetail();});
$("#backToList").addEventListener("click",()=>{if(detailHistoryActive){history.back();}else{closeDetail();}});
$("#detailLike").addEventListener("click",async()=>{if(!activePost)return;const id=activePost.id,likeRef=doc(db,"posts",id,"likes",me.uid),postRef=doc(db,"posts",id);try{await runTransaction(db,async tx=>{const [likeSnap,postSnap]=await Promise.all([tx.get(likeRef),tx.get(postRef)]);if(!postSnap.exists())throw Error("게시글이 삭제되었어요.");if(likeSnap.exists()){tx.delete(likeRef);tx.update(postRef,{likesCount:increment(-1)});}else{tx.set(likeRef,{uid:me.uid,createdAt:serverTimestamp()});tx.update(postRef,{likesCount:increment(1)});}});const fresh=await getDoc(postRef);activePost={id,...fresh.data()};$("#detailLike").textContent=(liked?"♡":"♥")+" 좋아요 "+Number(activePost.likesCount||0);$("#detailLike").classList.toggle("liked",!liked);liked=!liked;}catch(err){console.error(err);$("#detailStatus").textContent="좋아요 처리 실패: "+(err.code||err.message);}});
$("#commentForm").addEventListener("submit",async e=>{e.preventDefault();if(!activePost)return;const text=$("#commentText").value.trim();if(!text)return;const btn=e.target.querySelector("button");btn.disabled=true;try{await addDoc(collection(db,"comments"),{postId:activePost.id,ownerUid:me.uid,nickname:profile.nickname||"새로운 회원",text,createdAt:serverTimestamp()});await updateDoc(doc(db,"posts",activePost.id),{commentsCount:increment(1)});$("#commentText").value="";}catch(err){console.error(err);$("#detailStatus").textContent="댓글 등록 실패: "+(err.code||"권한을 확인해 주세요.");}finally{btn.disabled=false;}});
function confirmCommentDelete(){return new Promise(resolve=>{const layer=document.createElement("div");layer.className="comment-confirm-backdrop";layer.innerHTML='<div class="comment-confirm" role="dialog" aria-modal="true" aria-labelledby="commentConfirmTitle" aria-describedby="commentConfirmDesc"><div class="comment-confirm-icon">!</div><h3 id="commentConfirmTitle">댓글을 삭제할까요?</h3><p id="commentConfirmDesc">삭제한 댓글은 다시 복구할 수 없어요.</p><div class="comment-confirm-actions"><button type="button" class="comment-confirm-cancel">취소</button><button type="button" class="comment-confirm-delete">삭제하기</button></div></div>';document.body.appendChild(layer);const finish=value=>{layer.remove();resolve(value);};layer.querySelector(".comment-confirm-cancel").addEventListener("click",()=>finish(false));layer.querySelector(".comment-confirm-delete").addEventListener("click",()=>finish(true));layer.addEventListener("click",e=>{if(e.target===layer)finish(false);});const onKey=e=>{if(e.key==="Escape"){document.removeEventListener("keydown",onKey);finish(false);}};document.addEventListener("keydown",onKey);layer.querySelector(".comment-confirm-cancel").focus();});}
$("#comments").addEventListener("click",async e=>{const b=e.target.closest("[data-delete-comment]");if(!b)return;if(!(await confirmCommentDelete()))return;try{const ref=doc(db,"comments",b.dataset.deleteComment),snap=await getDoc(ref);if(!snap.exists()||snap.data().ownerUid!==me.uid)throw Error("본인 댓글만 삭제할 수 있어요.");await deleteDoc(ref);await updateDoc(doc(db,"posts",activePost.id),{commentsCount:increment(-1)});}catch(err){console.error(err);$("#detailStatus").textContent="댓글 삭제 실패: "+(err.code||err.message);}});
$("#detailContent").addEventListener("click",async e=>{if(e.target.closest("#postMenuTrigger")){const menu=$("#postMenuList"),trigger=$("#postMenuTrigger");if(menu){menu.classList.toggle("hidden");trigger.setAttribute("aria-expanded",String(!menu.classList.contains("hidden")));}return;}if(e.target.id==="editPost"){const p=activePost;if(p.ownerUid!==me.uid)return;$("#detailCard").classList.add("hidden");document.body.classList.remove("detail-mode");if(commentsUnsub){commentsUnsub();commentsUnsub=null;}editingId=p.id;$("#postTitle").value=p.title||"";$("#postBody").value=p.body||"";selectedImage=p.imageData||"";renderPreview();$("#formHeading").textContent="게시글 수정";$("#submitPost").textContent="수정 완료";$("#noticeToggle").checked=!!p.isNotice;$("#cancelEdit").classList.remove("hidden");$("#writeCard").classList.remove("hidden");$("#writeCard").scrollIntoView({behavior:"smooth",block:"start"});}if(e.target.id==="deletePost"){ $("#postMenuList")?.classList.add("hidden");if(!activePost||(activePost.ownerUid!==me.uid&&!isAdmin())||!confirm("게시글을 삭제할까요? 댓글과 좋아요도 함께 삭제됩니다."))return;try{const id=activePost.id;const [comments,likes]=await Promise.all([getDocs(query(collection(db,"comments"),where("postId","==",id))),getDocs(collection(db,"posts",id,"likes"))]);for(const docs of [comments,likes]){for(let i=0;i<docs.docs.length;i+=450){const batch=writeBatch(db);docs.docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));await batch.commit();}}await deleteDoc(doc(db,"posts",id));$("#detailCard").classList.add("hidden");activePost=null;if(commentsUnsub)commentsUnsub();}catch(err){console.error(err);$("#detailStatus").textContent="삭제 실패: "+(err.code||"권한을 확인해 주세요.");}}});
start();
</script>
</body></html>
