<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채팅 · COMMU</title><style>
:root{--bg:#f7f5fb;--ink:#29243b;--muted:#827d91;--line:#ece8f2;--p:#7862cf;--soft:#f0ecfb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,'Malgun Gothic',sans-serif;line-height:1.65}button,input,textarea{font:inherit}a{color:inherit}
header{background:linear-gradient(115deg,#7560c9,#b18bda 60%,#e8a8c8);color:white;padding:22px 18px}.top{max-width:1000px;margin:auto}.brand{font-size:26px;font-weight:850;letter-spacing:2px;text-decoration:none}.tag{font-size:13px;margin:2px 0 0}.nav{display:flex;gap:6px;overflow:auto;margin-top:16px}.nav a{display:block;text-decoration:none;color:white;padding:9px 13px;border-radius:10px;white-space:nowrap}.nav a.active,.nav a:hover{background:#fff;color:var(--p)}
main{max-width:1000px;margin:28px auto;padding:0 16px 55px}.eyebrow{font-size:12px;color:var(--p);font-weight:800;letter-spacing:1.4px}.page-head{margin-bottom:18px}.page-head h1{font-size:clamp(27px,4vw,36px);line-height:1.25;margin:6px 0}.muted{font-size:13px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #39245b0b}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 15px;background:var(--p);color:white;text-decoration:none;font-weight:700;cursor:pointer}.btn.alt{background:var(--soft);color:var(--p)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0 12px;outline-color:#a998ed}textarea.field{min-height:110px;resize:vertical}.notice{padding:12px;background:#fff8e9;border:1px solid #f3e5c6;color:#85652a;border-radius:10px;font-size:13px;margin:12px 0}.post{padding:16px 0;border-bottom:1px solid var(--line)}.post p{white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}.chatbox{height:360px;overflow:auto;background:#faf9fc;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.bubble{padding:9px 12px;margin:8px 0;background:white;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--soft);max-width:85%}.bubble small{display:block;color:var(--muted);font-size:11px}.pill{font-size:11px;color:var(--p);background:var(--soft);padding:3px 8px;border-radius:20px}.role-icon{display:inline-flex;align-items:center;vertical-align:-3px;margin-left:4px}.role-icon img{width:26px;height:26px;object-fit:contain}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:17px}.nav{gap:2px}.nav a{padding:8px 10px;font-size:13px}}
</style></head><body>
<header><div class="top"><a class="brand" href="index.html">COMMU</a><p class="tag">관심사를 나누고, 함께 만드는 우리들의 공간</p><nav class="nav"><a href="index.html">홈</a><a href="board.html" >게시판</a><a href="chat.html" class="active">채팅</a><a href="mypage.html" >마이페이지</a><a href="manage.html" >관리진</a></nav></div></header>
<main><div class="page-head"><div class="eyebrow">LIVE TALK</div><h1>채팅</h1><p class="muted">COMMU 안의 독립된 채팅 페이지입니다.</p></div><section class="card"><div class="notice">현재 채팅은 이 브라우저에 저장되는 시제품입니다. 다른 회원과 실시간으로 연결하려면 서버 기능이 필요합니다.</div><div class="chatbox" id="messages"></div><form id="chatForm" class="row"><input class="field" id="message" maxlength="300" placeholder="메시지를 입력해 주세요" required style="margin:0"><button class="btn">전송</button></form></section><div class="footer"><a class="btn alt" href="index.html">← 홈으로 돌아가기</a><p>COMMU · 함께 만드는 커뮤니티</p></div></main><script>const $=s=>document.querySelector(s),get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let profile=get('commu_demo_profile',{nickname:'새로운 회원'});let visitorId=localStorage.getItem('commu_demo_visitor_id');if(!visitorId){visitorId='visitor_'+Date.now().toString(36);localStorage.setItem('commu_demo_visitor_id',visitorId)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};let messages=get('commu_demo_messages',[]);function render(){ $('#messages').innerHTML=messages.map(m=>'<div class="bubble mine"><small>'+safe(m.nickname)+'</small>'+safe(m.text)+'</div>').join('')||'<div class="empty">아직 대화가 없어요.</div>';$('#messages').scrollTop=$('#messages').scrollHeight}$('#chatForm').onsubmit=e=>{e.preventDefault();let t=$('#message').value.trim();if(!t)return;messages.push({nickname:profile.nickname,text:t,time:Date.now()});set('commu_demo_messages',messages);$('#message').value='';render()};render();</script></body></html>
