<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 · COMMU</title>
<style>
:root{--bg:#f7f5fb;--ink:#29243b;--muted:#827d91;--line:#ece8f2;--primary:#7862cf;--soft:#f0ecfb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,'Malgun Gothic',sans-serif}
button,input{font:inherit}
header{padding:22px 18px;background:linear-gradient(115deg,#7560c9,#b18bda 60%,#e8a8c8);color:#fff}
.top,main{max-width:900px;margin:auto}
.brand{color:#fff;text-decoration:none;font-size:26px;font-weight:850;letter-spacing:2px}
.tag{margin:2px 0 0;font-size:13px}
.nav{display:flex;gap:6px;overflow:auto;margin-top:16px}
.nav a{padding:8px 12px;border-radius:10px;color:#fff;text-decoration:none;white-space:nowrap}
.nav a.active,.nav a:hover{background:#fff;color:var(--primary)}
main{padding:28px 16px 50px}
.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:1.4px}
h1{margin:6px 0;font-size:clamp(27px,4vw,36px)}
.muted{color:var(--muted);font-size:13px}
.card{padding:24px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #39245b0b}
.card h2{margin:0 0 5px;font-size:21px}
.preview{display:flex;align-items:center;gap:14px;margin:20px 0;padding:18px;border-radius:16px;background:#f8f6fc}
.preview-avatar{display:grid;place-items:center;flex:0 0 64px;width:64px;height:64px;border-radius:50%;background:#e6defb;font-size:32px}
.preview-name{font-weight:800}
.preview-bio{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.field-label{display:block;margin:15px 0 6px;font-size:13px;font-weight:750}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline-color:#a998ed}
.avatars{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 18px}
.avatar-option{width:45px;height:45px;border:2px solid transparent;border-radius:50%;background:#f2eefb;font-size:23px;cursor:pointer}
.avatar-option.selected{border-color:var(--primary);background:#e7e0fb}
.btn{margin-top:18px;padding:11px 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:750;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
#status{min-height:22px;margin:12px 0 0}
.note{margin-top:18px;padding:13px;border-radius:10px;background:#f8f6fc;color:var(--muted);font-size:12px}
.footer{text-align:center;padding:22px;color:var(--muted);font-size:12px}
.footer a{color:var(--primary)}
@media(max-width:600px){header{padding:18px 14px}.nav{gap:2px}.nav a{padding:8px 9px;font-size:13px}main{padding:22px 12px 40px}.card{padding:18px}}
</style>
</head>
<body>
<header><div class="top">
<a class="brand" href="index.html">COMMU</a>
<p class="tag">관심사를 나누고, 함께 만드는 우리들의 공간</p>
<nav class="nav" aria-label="주요 메뉴">
<a href="index.html">홈</a><a href="board.html">게시판</a><a href="chat.html">채팅</a><a class="active" href="mypage.html" aria-current="page">마이페이지</a><a href="manage.html">관리진</a>
</nav></div></header>
<main>
<div class="page-head"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1><p class="muted">나를 표현하는 프로필을 설정해 보세요.</p></div>
<section class="card">
<h2>내 프로필 설정</h2>
<p class="muted">저장한 프로필은 채팅방에서 다른 회원에게 보여요.</p>
<div class="preview"><div class="preview-avatar" id="previewAvatar">🐰</div><div><div class="preview-name" id="previewNickname">새로운 회원</div><div class="preview-bio" id="previewBio">상태 메시지를 입력해 주세요.</div></div></div>
<label class="field-label">프로필 아바타</label>
<div class="avatars" id="avatarOptions" aria-label="아바타 선택">
<button class="avatar-option selected" type="button" data-avatar="🐰" aria-label="토끼">🐰</button>
<button class="avatar-option" type="button" data-avatar="🐻" aria-label="곰">🐻</button>
<button class="avatar-option" type="button" data-avatar="🐱" aria-label="고양이">🐱</button>
<button class="avatar-option" type="button" data-avatar="🐶" aria-label="강아지">🐶</button>
<button class="avatar-option" type="button" data-avatar="🐼" aria-label="판다">🐼</button>
<button class="avatar-option" type="button" data-avatar="🦊" aria-label="여우">🦊</button>
<button class="avatar-option" type="button" data-avatar="🐣" aria-label="병아리">🐣</button>
<button class="avatar-option" type="button" data-avatar="🌷" aria-label="튤립">🌷</button>
<button class="avatar-option" type="button" data-avatar="⭐" aria-label="별">⭐</button>
<button class="avatar-option" type="button" data-avatar="🍀" aria-label="네잎클로버">🍀</button>
</div>
<label class="field-label" for="nickname">닉네임 (2~16자)</label>
<input class="field" id="nickname" maxlength="16" autocomplete="nickname" placeholder="닉네임을 입력해 주세요">
<label class="field-label" for="bio">상태 메시지 (최대 40자)</label>
<input class="field" id="bio" maxlength="40" placeholder="나를 소개하는 한마디를 적어보세요">
<button class="btn" id="saveProfile" type="button">프로필 저장</button>
<p id="status" class="muted" role="status" aria-live="polite"></p>
<div class="note">프로필은 Firebase 계정에 연결되어 저장돼요. 같은 브라우저의 같은 익명 로그인으로 접속하면 채팅방에서도 동일하게 표시됩니다.</div>
</section>
<div class="footer"><a href="index.html">← 홈으로 돌아가기</a><p>COMMU · 함께 만드는 커뮤니티</p></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCad2Z3vp6TCsdIynl-8WeWTH5FTAu06E",
 authDomain:"commu-chat-4c35f.firebaseapp.com",
 projectId:"commu-chat-4c35f",
 storageBucket:"commu-chat-4c35f.firebasestorage.app",
 messagingSenderId:"371606149626",
 appId:"1:371606149626:web:47fdda1440716e54e56c43",
 measurementId:"G-D71CX7RW30"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=selector=>document.querySelector(selector);
let selectedAvatar="🐰";

function updatePreview(){
 $("#previewAvatar").textContent=selectedAvatar;
 $("#previewNickname").textContent=$("#nickname").value.trim()||"새로운 회원";
 $("#previewBio").textContent=$("#bio").value.trim()||"상태 메시지를 입력해 주세요.";
 document.querySelectorAll(".avatar-option").forEach(button=>{
  const selected=button.dataset.avatar===selectedAvatar;
  button.classList.toggle("selected",selected);
  button.setAttribute("aria-pressed",String(selected));
 });
}
document.querySelectorAll(".avatar-option").forEach(button=>{
 button.addEventListener("click",()=>{
  selectedAvatar=button.dataset.avatar;
  updatePreview();
 });
});
$("#nickname").addEventListener("input",updatePreview);
$("#bio").addEventListener("input",updatePreview);

async function loadProfile(){
 try{
  $("#status").textContent="프로필을 불러오고 있어요...";
  await signInAnonymously(auth);
  const profileRef=doc(db,"profiles",auth.currentUser.uid);
  const snapshot=await getDoc(profileRef);
  const saved=snapshot.exists()?snapshot.data():{};
  $("#nickname").value=saved.nickname||"새로운 회원";
  $("#bio").value=saved.bio||"";
  selectedAvatar=saved.avatar||"🐰";
  updatePreview();
  $("#status").textContent="프로필을 불러왔어요.";
 }catch(error){
  console.error("프로필 불러오기 오류:",error);
  $("#status").textContent="프로필을 불러오지 못했어요. Firebase 로그인과 profiles 보안 규칙을 확인해 주세요.";
 }
}
$("#saveProfile").addEventListener("click",async()=>{
 const nickname=$("#nickname").value.trim();
 const bio=$("#bio").value.trim();
 if(nickname.length<2||nickname.length>16){
  $("#status").textContent="닉네임은 2~16자로 입력해 주세요.";
  $("#nickname").focus();
  return;
 }
 const button=$("#saveProfile");
 button.disabled=true;
 try{
  if(!auth.currentUser)await signInAnonymously(auth);
  const profile={nickname,avatar:selectedAvatar,bio:bio.slice(0,40)};
  await setDoc(doc(db,"profiles",auth.currentUser.uid),profile);
  localStorage.setItem("commu_demo_profile",JSON.stringify(profile));
  $("#status").textContent="프로필을 저장했어요. 채팅방에도 반영됩니다.";
  updatePreview();
 }catch(error){
  console.error("프로필 저장 오류:",error);
  $("#status").textContent="저장하지 못했어요. Firestore profiles 보안 규칙을 확인해 주세요.";
 }finally{
  button.disabled=false;
 }
});
updatePreview();
loadProfile();
</script>
</body>
</html>
