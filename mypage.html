<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이페이지 · COMMU</title>
<style>
:root{--bg:#f7f5fb;--ink:#29243b;--muted:#827d91;--line:#ece8f2;--p:#7862cf;--soft:#f0ecfb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,'Malgun Gothic',sans-serif;line-height:1.65}
button,input{font:inherit}a{color:inherit}header{background:linear-gradient(115deg,#7560c9,#b18bda 60%,#e8a8c8);color:white;padding:22px 18px}
.top,main{max-width:1000px;margin:auto}.brand{font-size:26px;font-weight:850;letter-spacing:2px;text-decoration:none}.tag{font-size:13px;margin:2px 0 0}
.nav{display:flex;gap:6px;overflow:auto;margin-top:16px}.nav a{display:block;text-decoration:none;color:white;padding:9px 13px;border-radius:10px;white-space:nowrap}.nav a.active,.nav a:hover{background:white;color:var(--p)}
main{margin:28px auto;padding:0 16px 55px}.eyebrow{font-size:12px;color:var(--p);font-weight:800;letter-spacing:1.4px}.page-head{margin-bottom:18px}.page-head h1{font-size:clamp(27px,4vw,36px);line-height:1.25;margin:6px 0}
.muted{font-size:13px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #39245b0b}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 15px;background:var(--p);color:white;text-decoration:none;font-weight:700;cursor:pointer}.btn.alt{background:var(--soft);color:var(--p)}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0 12px;outline-color:#a998ed}
.field-label{display:block;font-size:13px;font-weight:700;margin-top:12px}
.profile-preview{display:flex;align-items:center;gap:14px;padding:18px;background:#f8f6fc;border-radius:16px;margin:12px 0 20px}
.profile-preview-avatar{width:76px;height:76px;display:grid;place-items:center;border-radius:18px;background:#e6defb;font-size:32px;flex:0 0 76px;overflow:hidden}
.profile-preview-avatar img{width:100%;height:100%;object-fit:cover}
.stamp-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.hint{font-size:12px;color:var(--muted);margin:5px 0 12px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:700px){.card{padding:17px}.nav{gap:2px}.nav a{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header><div class="top"><a class="brand" href="index.html">COMMU</a><p class="tag">관심사를 나누고, 함께 만드는 우리들의 공간</p>
<nav class="nav"><a href="index.html">홈</a><a href="board.html">게시판</a><a href="chat.html">채팅</a><a href="mypage.html" class="active">마이페이지</a><a href="manage.html">관리진</a></nav></div></header>
<main>
<div class="page-head"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1><p class="muted">나를 나타내는 이름과 인장을 설정해 보세요.</p></div>
<section class="card">
<h2>내 프로필 설정</h2><p class="muted">설정한 이름과 인장은 채팅방 프로필에도 표시돼요.</p>
<div class="profile-preview"><div class="profile-preview-avatar" id="previewStamp">🐰</div><div><strong id="previewNickname">새로운 회원</strong><div class="muted" id="previewBio">상태 메시지를 입력해 주세요.</div></div></div>
<label class="field-label" for="nickname">이름(닉네임)</label><input class="field" id="nickname" maxlength="16" placeholder="이름을 입력해 주세요">
<label class="field-label" for="stampFile">인장 사진</label>
<div class="stamp-actions"><button class="btn alt" type="button" id="chooseStamp">갤러리에서 사진 불러오기</button><button class="btn alt" type="button" id="removeStamp">인장 삭제</button></div>
<input id="stampFile" type="file" accept="image/*" hidden>
<p class="hint">JPG, PNG, WEBP 사진을 선택할 수 있어요. 저장 공간을 아끼기 위해 사진은 자동으로 작게 조정돼요.</p>
<label class="field-label" for="bio">상태 메시지</label><input class="field" id="bio" maxlength="40" placeholder="나를 소개하는 한마디를 적어보세요">
<button class="btn" id="saveProfile" type="button">프로필 저장</button><p id="status" class="muted" role="status"></p>
</section>
<div class="footer"><a class="btn alt" href="index.html">← 홈으로 돌아가기</a><p>COMMU · 함께 만드는 커뮤니티</p></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCad2Z3vp6TCsdIynlR-8WeWTH5FTAu06E",authDomain:"commu-chat-4c35f.firebaseapp.com",projectId:"commu-chat-4c35f",storageBucket:"commu-chat-4c35f.firebasestorage.app",messagingSenderId:"371606149626",appId:"1:371606149626:web:47fdda1440716e54e56c43",measurementId:"G-D71CX7RW30"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
let stampData="";
function preview(){const box=$("#previewStamp");box.innerHTML=stampData?'<img alt="선택한 인장 사진">':"🐰";if(stampData)box.querySelector("img").src=stampData;$("#previewNickname").textContent=$("#nickname").value.trim()||"새로운 회원";$("#previewBio").textContent=$("#bio").value.trim()||"상태 메시지를 입력해 주세요."}
$("#nickname").addEventListener("input",preview);$("#bio").addEventListener("input",preview);
$("#chooseStamp").addEventListener("click",()=>$("#stampFile").click());
$("#removeStamp").addEventListener("click",()=>{stampData="";$("#stampFile").value="";preview();$("#status").textContent="인장 사진을 삭제했어요. 저장을 눌러 적용해 주세요."});
$("#stampFile").addEventListener("change",event=>{const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){$("#status").textContent="이미지 파일을 선택해 주세요.";return}if(file.size>10*1024*1024){$("#status").textContent="10MB 이하의 사진을 선택해 주세요.";return}
const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas"),max=320,scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);stampData=canvas.toDataURL("image/jpeg",0.78);preview();$("#status").textContent="인장을 선택했어요. 프로필 저장을 눌러주세요."};img.onerror=()=>$("#status").textContent="사진을 읽지 못했어요. 다른 이미지를 선택해 주세요.";img.src=reader.result};reader.readAsDataURL(file)});
async function loadProfile(){try{await signInAnonymously(auth);const saved=(await getDoc(doc(db,"profiles",auth.currentUser.uid))).data()||{};$("#nickname").value=saved.nickname||"새로운 회원";$("#bio").value=saved.bio||"";stampData=saved.stampData||"";localStorage.setItem("commu_demo_profile",JSON.stringify({nickname:$("#nickname").value,bio:$("#bio").value,stampData}));preview()}catch(error){console.error(error);const cached=JSON.parse(localStorage.getItem("commu_demo_profile")||"{}");$("#nickname").value=cached.nickname||"새로운 회원";$("#bio").value=cached.bio||"";stampData=cached.stampData||"";preview();$("#status").textContent="서버에서 프로필을 불러오지 못했어요. 연결 상태를 확인해 주세요."}}
$("#saveProfile").addEventListener("click",async()=>{const nickname=$("#nickname").value.trim(),bio=$("#bio").value.trim();if(nickname.length<2||nickname.length>16){$("#status").textContent="이름은 2~16자로 입력해 주세요.";return}const profile={nickname,bio:bio.slice(0,40),stampData};const button=$("#saveProfile");button.disabled=true;try{if(!auth.currentUser)await signInAnonymously(auth);await setDoc(doc(db,"profiles",auth.currentUser.uid),profile);localStorage.setItem("commu_demo_profile",JSON.stringify(profile));$("#status").textContent="이름과 인장을 저장했어요. 채팅방에서도 사용할 수 있어요."}catch(error){console.error(error);$("#status").textContent="저장에 실패했어요. Firestore 프로필 보안 규칙과 사진 용량을 확인해 주세요."}finally{button.disabled=false}});
loadProfile();
</script>
</body></html>
